<text x="24" y="810" font-size="14" fill="#5b6270">Également recalculées chaque jour : la ligne de chaque groupe sur chaque scrutin (vue 2), et la liste des réunions de commission</text>
<text x="24" y="828" font-size="14" fill="#5b6270">retenues pour la présence (réunions confirmées, passées, avec au moins un présent). IMPORT trace les fichiers téléchargés ; il n&#x27;est lié à rien.</text>
<text x="24" y="864" font-size="13" fill="#5b6270">Rectangle : entité (identifiant souligné). Ellipse : association, avec ses attributs. Cardinalités min,max côté entité ; (1,1) : identification relative. Pointillés : donnée calculée, base séparée ou rappel d&#x27;une autre vue.</text>
