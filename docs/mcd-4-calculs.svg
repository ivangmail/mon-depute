<text x="723" y="970" font-size="14" fill="#1c1f26">intitulé en langage courant (fichier, validé)</text>
<text x="900" y="1008" font-size="12" text-anchor="middle" fill="#5b6270">même entité que DOSSIER (vue 2) : attributs calculés ou lus dans des fichiers, sans colonne</text>
<text x="24" y="1110" font-size="14" fill="#5b6270">Également recalculées chaque jour : la ligne de chaque groupe sur chaque scrutin (vue 2), et la liste des réunions de commission</text>
<text x="24" y="1128" font-size="14" fill="#5b6270">retenues pour la présence (réunions confirmées, passées, avec au moins un présent).</text>
<text x="24" y="1164" font-size="13" fill="#5b6270">Rectangle : entité (identifiant souligné). Ellipse : association, avec ses attributs. Cardinalités min,max côté entité ; (1,1) : identification relative. Pointillés : donnée calculée, base séparée ou rappel d&#x27;une autre vue.</text>
