name: Tests

# Le site est publié depuis son propre serveur (voir deploiement/README.md).
# Ici, on vérifie seulement que les tests passent à chaque modification.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest
